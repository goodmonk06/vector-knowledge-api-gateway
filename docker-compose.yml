version: '3.8'

services:
  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vector-gateway-postgres
    environment:
      POSTGRES_DB: vectordb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vector-network

  # API Gateway Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vector-gateway-app
    environment:
      NODE_ENV: production
      PORT: 3000

      # Vector Stores
      ENABLED_STORES: pgvector

      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEFAULT_EMBEDDING_MODEL: text-embedding-3-small

      # PostgreSQL
      PGVECTOR_HOST: postgres
      PGVECTOR_PORT: 5432
      PGVECTOR_DATABASE: vectordb
      PGVECTOR_USER: postgres
      PGVECTOR_PASSWORD: postgres

      # Qdrant (optional)
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}

      # Defaults
      DEFAULT_TOP_K: 5
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vector-network
    restart: unless-stopped

  # Qdrant (optional, commented out by default)
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   container_name: vector-gateway-qdrant
  #   ports:
  #     - "6333:6333"
  #     - "6334:6334"
  #   volumes:
  #     - qdrant_data:/qdrant/storage
  #   networks:
  #     - vector-network

volumes:
  postgres_data:
  # qdrant_data:

networks:
  vector-network:
    driver: bridge
